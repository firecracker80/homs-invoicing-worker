# HOMS Invoicing Worker — deployed via Cloudflare GitHub integration
name = "homs-invoicing-worker-0e0e"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
WORKER_URL = "https://homs-invoicing-worker-0e0e.yari-058.workers.dev"

# Create both namespaces in the Cloudflare dashboard (Storage & Databases → KV),
# then paste their IDs here. IDs are not secrets — safe to commit.
[[kv_namespaces]]
binding = "TENANTS"
id = "e991d4f4c0cc41e29a00aba8d9745c34"

[[kv_namespaces]]
binding = "BOOKINGS"
id = "1138218f692649eba0b624a2492f5409"

# Ledger DB for owner/manager statements + reconciliation (src/ledger.js,
# src/reports.js). Schema in schema/homs_ledger_schema.sql.
[[d1_databases]]
binding = "LEDGER_DB"
database_name = "homs-ledger"
database_id = "4a53f696-1bf9-4084-8f72-25ce5b9c5bef"

# ============================================================================
# STAGING — completely separate data (own KV, own D1), deploys from the
# `staging` branch. See STAGING.md for the one manual Cloudflare-dashboard
# step this needs (creating the staging Worker itself + its Build config)
# and the promote-to-production flow. Never point this at a real tenant's
# GHL/PayPal/Airtable credentials -- seed it with sandbox-only config.
[env.staging]
name = "homs-invoicing-worker-0e0e-staging"

[env.staging.vars]
WORKER_URL = "https://homs-invoicing-worker-0e0e-staging.yari-058.workers.dev"

[[env.staging.kv_namespaces]]
binding = "TENANTS"
id = "e37d25ba95f84456b9b0b13de2ad6757"

[[env.staging.kv_namespaces]]
binding = "BOOKINGS"
id = "af89eb524ae84cc0845caefbf70dfc98"

[[env.staging.d1_databases]]
binding = "LEDGER_DB"
database_name = "homs-ledger-staging"
database_id = "051289d3-0730-427f-8052-5166c01cabd2"
